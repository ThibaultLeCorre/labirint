image: rocker/verse:4.3.2

variables:
  QUARTO_VERSION: 1.7.32
  BASENAME: index

before_script:
  # Installer les packages R nécessaires
  - R -e "install.packages(c('quarto', 'knitr', 'tidyverse', 'rmarkdown'), repos='https://cloud.r-project.org/')"

pages:
  script:
    - mkdir -p public
    - rm -rf public/*            # Nettoie le dossier avant build
    # Télécharger et installer Quarto
    - wget -q "https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-amd64.deb"
    - dpkg -i quarto-${QUARTO_VERSION}-linux-amd64.deb || apt-get install -f -y
    # Rendre le site Quarto dans le dossier public
    - quarto render . --output-dir=public/
    # Copier _site si nécessaire
    - if [ -d "_site" ]; then cp -R _site/* public/; fi

  artifacts:
    paths:
      - public

  only:
    - main
